spring.application.name=NexusHR
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}


# ===============================
# DATABASE CONFIGURATION
# ===============================
# Override per-profile in application-dev.properties / application-prod.properties.
# Fallback values are safe for local development only.

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexushr}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA CONFIGURATION
# ===============================
# ddl-auto is overridden per profile:
#   dev  -> update   (auto-migrates schema locally)
#   prod -> validate (fails fast if schema is wrong; never mutates the live DB)

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# SERVER PORT
# ===============================

server.port=${PORT:8081}

# ===============================
# JWT CONFIGURATION
# ===============================
# jwt.secret MUST be overridden via the JWT_SECRET environment variable in production.

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ===============================
# CORS CONFIGURATION
# ===============================
# Set FRONTEND_URL in your environment to restrict origins in production.
# Multiple origins can be comma-separated: https://app.example.com,https://preview.example.com
# Defaults to "*" for local development.

allowed.origins=${FRONTEND_URL:*}

# ===============================
# FILE UPLOAD CONFIGURATION
# Medical Leave documents: max 10MB
# ===============================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ===============================
# CLOUDINARY CONFIGURATION
# ===============================
# Leave blank to use mock mode (files stored locally in /uploads folder).
# Set all three variables to enable real Cloudinary uploads.

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ===============================
# LOGGING
# ===============================

logging.level.com.nexushr=INFO
logging.level.org.springframework.security=WARN