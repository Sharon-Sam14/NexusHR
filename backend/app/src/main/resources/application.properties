spring.application.name=NexusHR

# ===============================
# DATABASE CONFIGURATION
# ===============================

spring.datasource.url=jdbc:postgresql://localhost:5432/nexushr
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA CONFIGURATION
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# SERVER PORT
# ===============================

server.port=8081

# ===============================
# JWT CONFIGURATION
# ===============================

jwt.secret=NexusHRSuperSecretKey2024ProductionGradeJWTKey!@#$%
jwt.expiration=86400000

# ===============================
# FILE UPLOAD CONFIGURATION
# Medical Leave documents: max 10MB
# ===============================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ===============================
# CLOUDINARY CONFIGURATION
# ===============================
# To enable real Cloudinary uploads, set your credentials below.
# Free tier: https://cloudinary.com/users/register_free
# Leave blank to use mock mode (files stored locally in /uploads folder).
#
# cloudinary.cloud-name=YOUR_CLOUD_NAME
# cloudinary.api-key=YOUR_API_KEY
# cloudinary.api-secret=YOUR_API_SECRET

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ===============================
# LOGGING
# ===============================

logging.level.com.nexushr=INFO
logging.level.org.springframework.security=WARN