# ==============================================================================
# NexusHR — Production Profile (Render + Neon PostgreSQL)
# Active when: SPRING_PROFILES_ACTIVE=prod  (set in Render environment variables)
# ==============================================================================
# IMPORTANT: All ${...} placeholders MUST be set as environment variables in
# the Render service dashboard before deployment. There are no fallbacks here.
# ==============================================================================

# ===============================
# DATABASE — Neon PostgreSQL
# Set these in Render → Environment Variables
# ===============================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Connection pool tuning for Neon serverless PostgreSQL
# Neon closes idle connections after 5 minutes; keep the pool small
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# ===============================
# JPA — NEVER auto-alter the live schema
# ===============================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ===============================
# CORS — Restrict to your Vercel frontend URL
# Set FRONTEND_URL in Render environment variables
# Example: https://nexushr.vercel.app
# ===============================

allowed.origins=${FRONTEND_URL}

# ===============================
# LOGGING — Minimal noise in production
# ===============================

logging.level.com.nexushr=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
