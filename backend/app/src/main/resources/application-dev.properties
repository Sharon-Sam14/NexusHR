# ==============================================================================
# NexusHR — Development Profile
# Active when: spring.profiles.active=dev
# Run with: mvn spring-boot:run -pl app -Dspring-boot.run.profiles=dev
# ==============================================================================

# ===============================
# DATABASE — Local PostgreSQL
# ===============================

spring.datasource.url=jdbc:postgresql://localhost:5432/nexushr
spring.datasource.username=postgres
spring.datasource.password=123456

# ===============================
# JPA — Allow Hibernate to manage schema locally
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===============================
# CORS — Allow all origins in development
# ===============================

allowed.origins=*

# ===============================
# LOGGING — Verbose in development
# ===============================

logging.level.com.nexushr=DEBUG
logging.level.org.springframework.security=INFO

# ===============================
# JWT — Local Development Secret
# ===============================
jwt.secret=LOCAL_DEVELOPMENT_SECRET_CHANGE_IN_PRODUCTION

